name: Build

# Baut Tonuino-Studio auf Windows, Linux und macOS und macht damit den
# plattformuebergreifenden Support tatsaechlich ueberpruefbar (PyInstaller
# kompiliert nicht plattformuebergreifend - ein Windows-Build allein sagt
# nichts darueber aus, ob die App auf Linux/macOS funktioniert).
#
# Jeder Job baut nicht nur, sondern startet die gebaute Datei auch einmal (Linux via
# xvfb), um fehlende Module und Systembibliotheken (Qt xcb-Plugin, PC/SC) frueh zu erkennen.

# Nur fuer Release-Tags (v*) oder von Hand: im privaten Repository zaehlen
# macOS-Minuten zehnfach. Lint und Tests bei jedem Push: tests.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Bei einem Tag v*: zuerst einen Release-Entwurf anlegen (genau einen - die
  # vier Build-Jobs haengen ihre Installer danach nur an). Veroeffentlicht wird
  # von Hand auf GitHub, nachdem die Release-Notes ergaenzt sind.
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag passt zur Version im Code
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/core/__init__.py').read()).group(1))")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu __version__ = $VERSION (src/core/__init__.py)"
            exit 1
          fi

      - name: Release-Entwurf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Tonuino-Studio ${GITHUB_REF_NAME#v}" \
            --notes "Entwurf: Release-Notes ergaenzen, Installer pruefen, dann veroeffentlichen."

  build:
    needs: draft
    # Auch ohne Tag (von Hand gestartet) bauen - dann ist der Entwurf-Job uebersprungen
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact_glob: dist/Tonuino-Studio-*-Setup.exe
          - os: ubuntu-latest
            name: linux
            artifact_glob: dist/tonuino-studio_*_amd64.deb
          - os: macos-latest
            name: macos-arm64
            artifact_glob: dist/Tonuino-Studio-*.dmg
          - os: macos-15-intel
            name: macos-intel
            artifact_glob: dist/Tonuino-Studio-*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: System-Abhaengigkeiten installieren (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          # pcscd/libpcsclite-dev: PC/SC-Stack fuer pyscard (RFID-Reader-Zugriff)
          # swig: wird von pyscard benoetigt, falls aus dem Quellcode gebaut wird
          # libxcb-cursor0 & Co: Qt6 "xcb"-Plattform-Plugin (haeufigste Ursache
          #   fuer "could not load the Qt platform plugin" auf frischen Linux-Systemen)
          # libpulse0: Laufzeit-Abhaengigkeit von QtMultimedia (Audio-Player) -
          #   ohne sie schlaegt schon der Import von PyQt6.QtMultimedia fehl
          # xvfb: virtueller Display-Server fuer den headless GUI-Smoketest
          sudo apt-get install -y \
            pcscd libpcsclite-dev libpcsclite1 swig \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libegl1 \
            libpulse0 \
            xvfb

      - name: Python-Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (pyflakes)
        run: python -m pyflakes src main.py tests

      - name: Tests (pytest)
        run: python -m pytest -q

      - name: Build ausfuehren
        run: python build_package.py

      # Startet die gebaute Datei, nicht den Quelltext: Nur so fallen Module und Daten auf,
      # die PyInstaller nicht mitgenommen hat. Mit TONUINO_SMOKE_TEST schliesst sie sich selbst.
      # Bleibt sie haengen, etwa an einem Dialog, beendet das Zeitlimit den Schritt als Fehler.
      - name: Smoketest der gebauten Datei
        shell: bash
        timeout-minutes: 3
        env:
          TONUINO_SMOKE_TEST: "1"
        run: |
          case "${{ matrix.name }}" in
            windows) ./dist/Tonuino-Studio.exe ;;
            linux) xvfb-run --auto-servernum ./dist/Tonuino-Studio ;;
            *) ./dist/Tonuino-Studio.app/Contents/MacOS/Tonuino-Studio ;;
          esac

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v7
        with:
          name: tonuino-studio-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

      - name: Installer an den Release-Entwurf haengen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.artifact_glob }} --clobber
